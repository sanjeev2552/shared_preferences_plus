name: shared_preferences_plus_web
description: "A new Flutter plugin project."
version: 1.0.0
homepage:
publish_to: "none" # Remove this line if you wish to publish to pub.dev

environment:
  sdk: ^3.11.1
  flutter: ">=3.3.0"

flutter:
  plugin:
    implements: shared_preferences_plus
    platforms:
      web:
        pluginClass: SharedPreferencesPlusWeb
        fileName: shared_preferences_plus_web.dart

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  web: ^1.0.0
  shared_preferences_plus_platform_interface:
    path: ../shared_preferences_plus_platform_interface

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
