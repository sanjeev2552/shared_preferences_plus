name: shared_preferences_plus_web
description: "Web implementation of shared_preferences_plus."
version: 1.1.0
homepage: https://github.com/sanjeev2552/shared_preferences_plus
repository: https://github.com/sanjeev2552/shared_preferences_plus
issue_tracker: https://github.com/sanjeev2552/shared_preferences_plus/issues

resolution: workspace

environment:
  sdk: ^3.11.1
  flutter: ">=3.41.4"

flutter:
  plugin:
    implements: shared_preferences_plus
    platforms:
      web:
        pluginClass: SharedPreferencesPlusWeb
        fileName: shared_preferences_plus_web.dart

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  web: ^1.0.0
  shared_preferences_plus_platform_interface: ^1.1.0

dev_dependencies:
  shared_preferences_plus_test_support:
    path: ../test_support
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
